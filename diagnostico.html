<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>COF — Diagnóstico v2</title>
<style>
  body{background:#0a0c0f;color:#e6edf3;font-family:'IBM Plex Mono',monospace;padding:32px;max-width:960px;margin:0 auto;font-size:12px;}
  h1{color:#3fb950;font-size:15px;margin-bottom:4px;}
  p{color:#8b949e;font-size:11px;margin-bottom:20px;}
  .test{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:14px 18px;margin-bottom:10px;}
  .test-name{color:#58a6ff;font-size:12px;font-weight:600;margin-bottom:4px;}
  .desc{font-size:10px;color:#8b949e;margin-bottom:8px;}
  .status{font-size:11px;padding:2px 8px;border-radius:3px;display:inline-block;margin-bottom:8px;}
  .ok{background:#1a4a2a;color:#3fb950;}
  .err{background:#4a1a1a;color:#f85149;}
  .wait{background:#3d2a00;color:#d29922;}
  .detail{font-size:10px;color:#8b949e;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;margin-top:6px;background:#0d1117;padding:8px;border-radius:4px;}
  button{background:#1a4a2a;color:#3fb950;border:1px solid rgba(63,185,80,.3);padding:8px 20px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;margin-right:10px;margin-bottom:20px;}
  button:hover{background:#1f5a32;}
  .section{color:#bc8cff;font-size:11px;margin:20px 0 8px;letter-spacing:1px;text-transform:uppercase;}
  textarea{background:#111418;border:1px solid #30363d;color:#e6edf3;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:8px 10px;border-radius:4px;width:100%;height:80px;margin-bottom:8px;resize:vertical;}
  label{font-size:10px;color:#8b949e;display:block;margin-bottom:3px;}
</style>
</head>
<body>
<h1>COF · Diagnóstico API NASS v2</h1>
<p>Proxy: /nass-api → quickstats.nass.usda.gov · El 413 en test vacío es normal (proxy OK). Los 400 indican queries inválidas — este diagnóstico encuentra cuáles funcionan.</p>

<button onclick="runAll()">▶ Correr todos</button>
<button onclick="runCustom()">▶ Query manual</button>

<div class="section">Query manual</div>
<div class="test">
  <label>Parámetros (uno por línea, formato clave=valor):</label>
  <textarea id="customParams">commodity_desc=CATTLE
statisticcat_desc=ON FEED
agg_level_desc=NATIONAL
freq_desc=MONTHLY
year=2025</textarea>
  <div id="customResult" class="detail" style="display:none"></div>
</div>

<div class="section">Tests automáticos — de mínimo a completo</div>
<div id="tests"></div>

<script>
const KEY = 'EB7D3956-F3E0-3023-A6E7-602F604D4B67';

async function call(params) {
  const qs = new URLSearchParams({ key: KEY, format: 'JSON', ...params });
  const url = '/nass-api?' + qs.toString();
  const t0 = Date.now();
  try {
    const res = await fetch(url);
    const ms = Date.now() - t0;
    const text = await res.text();
    let json = null;
    try { json = JSON.parse(text); } catch {}
    return { ok: res.ok, status: res.status, ms, json, raw: text.slice(0, 800), url };
  } catch(e) {
    return { ok: false, status: 0, ms: Date.now()-t0, json: null, raw: e.message, url };
  }
}

function summary(r) {
  const count = r.json?.data?.length ?? 0;
  if (!r.ok) return `HTTP ${r.status}\n${r.raw}`;
  if (!count) return `HTTP ${r.status} · 0 registros\n${r.raw.slice(0,300)}`;
  const sample = r.json.data.slice(0,5).map(d =>
    `  ${d.year} ${(d.reference_period_desc||'').padEnd(12)} → ${d.Value} ${d.unit_desc||''} | ${(d.short_desc||'').slice(0,55)}`
  ).join('\n');
  return `${count} registros\n${sample}${count>5?`\n  …+${count-5} más`:''}`;
}

const TESTS = [
  // Minimal single params
  { name: '1 · Solo commodity_desc=CATTLE', p: { commodity_desc:'CATTLE' } },
  { name: '2 · Solo short_desc inventory', p: { short_desc:'CATTLE, ON FEED - INVENTORY' } },
  { name: '3 · Solo short_desc placements', p: { short_desc:'CATTLE, ON FEED - PLACED, MEASURED IN HEAD' } },
  { name: '4 · Solo short_desc marketings', p: { short_desc:'CATTLE, ON FEED - SOLD, MEASURED IN HEAD' } },

  // Try exact year (not year__GE)
  { name: '5 · short_desc inv + year=2025 (sin GE)', p: { short_desc:'CATTLE, ON FEED - INVENTORY', year:'2025' } },
  { name: '6 · short_desc inv + year__GE=2025', p: { short_desc:'CATTLE, ON FEED - INVENTORY', year__GE:'2025' } },

  // agg_level without other filters
  { name: '7 · commodity + agg_level=NATIONAL', p: { commodity_desc:'CATTLE', agg_level_desc:'NATIONAL' } },
  { name: '8 · short_desc + agg_level=NATIONAL', p: { short_desc:'CATTLE, ON FEED - INVENTORY', agg_level_desc:'NATIONAL' } },

  // freq_desc
  { name: '9 · commodity + freq_desc=MONTHLY', p: { commodity_desc:'CATTLE', freq_desc:'MONTHLY' } },
  { name: '10 · short_desc + freq_desc=MONTHLY', p: { short_desc:'CATTLE, ON FEED - INVENTORY', freq_desc:'MONTHLY' } },

  // statisticcat_desc variants (ON FEED vs INVENTORY)
  { name: '11 · cattle + statisticcat=ON FEED', p: { commodity_desc:'CATTLE', statisticcat_desc:'ON FEED' } },
  { name: '12 · cattle + statisticcat=INVENTORY', p: { commodity_desc:'CATTLE', statisticcat_desc:'INVENTORY' } },

  // sector_desc
  { name: '13 · sector=ANIMALS & PRODUCTS + commodity=CATTLE', p: { sector_desc:'ANIMALS & PRODUCTS', commodity_desc:'CATTLE' } },

  // Combo: 2 params
  { name: '14 · commodity + year=2025 (exact)', p: { commodity_desc:'CATTLE', year:'2025' } },
  { name: '15 · commodity + agg_level + year=2025', p: { commodity_desc:'CATTLE', agg_level_desc:'NATIONAL', year:'2025' } },
  { name: '16 · commodity + freq + year=2025', p: { commodity_desc:'CATTLE', freq_desc:'MONTHLY', year:'2025' } },

  // Combo: 3 params
  { name: '17 · commodity + agg + freq + year=2025', p: { commodity_desc:'CATTLE', agg_level_desc:'NATIONAL', freq_desc:'MONTHLY', year:'2025' } },
  { name: '18 · commodity + statisticcat=ON FEED + agg + year=2025', p: { commodity_desc:'CATTLE', statisticcat_desc:'ON FEED', agg_level_desc:'NATIONAL', year:'2025' } },

  // Try param_value_only to discover valid short_desc values
  { name: '19 · param_values: short_desc for CATTLE ON FEED', p: { param_value_only:'short_desc', commodity_desc:'CATTLE', statisticcat_desc:'ON FEED' } },
  { name: '20 · param_values: short_desc for CATTLE INVENTORY', p: { param_value_only:'short_desc', commodity_desc:'CATTLE', statisticcat_desc:'INVENTORY' } },

  // Try without sector_desc but with unit_desc
  { name: '21 · cattle + unit_desc=HEAD + agg + freq + year=2025', p: { commodity_desc:'CATTLE', unit_desc:'HEAD', agg_level_desc:'NATIONAL', freq_desc:'MONTHLY', year:'2025' } },
];

function buildUI() {
  const wrap = document.getElementById('tests');
  wrap.innerHTML = '';
  TESTS.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'test'; d.id = 't'+i;
    d.innerHTML = `<div class="test-name">${t.name}</div>
      <div class="desc">${Object.entries(t.p).map(([k,v])=>`${k}=<b>${v}</b>`).join(' · ')}</div>
      <span class="status wait" id="s${i}">pendiente</span>
      <div class="detail" id="d${i}" style="display:none"></div>`;
    wrap.appendChild(d);
  });
}

async function runOne(i) {
  const r = await call(TESTS[i].p);
  const s = document.getElementById('s'+i);
  const det = document.getElementById('d'+i);
  const count = r.json?.data?.length ?? 0;
  s.textContent = r.ok
    ? (count > 0 ? `✓ ${count} registros · ${r.ms}ms` : `OK pero 0 datos · ${r.ms}ms`)
    : `✗ HTTP ${r.status} · ${r.ms}ms`;
  s.className = 'status ' + (r.ok && count > 0 ? 'ok' : r.ok ? 'wait' : 'err');
  det.textContent = `URL: ...?${new URLSearchParams({key:'***',format:'JSON',...TESTS[i].p})}\n\n${summary(r)}`;
  det.style.display = 'block';
}

async function runAll() {
  buildUI();
  for (let i = 0; i < TESTS.length; i++) await runOne(i);
}

async function runCustom() {
  const raw = document.getElementById('customParams').value;
  const params = {};
  raw.split('\n').forEach(line => {
    const eq = line.indexOf('=');
    if (eq > 0) params[line.slice(0,eq).trim()] = line.slice(eq+1).trim();
  });
  const res = document.getElementById('customResult');
  res.style.display = 'block';
  res.textContent = 'llamando…';
  const r = await call(params);
  res.textContent = `URL: ${r.url.replace(KEY,'***')}\n\n${summary(r)}\n\nRAW:\n${r.raw}`;
}

buildUI();
</script>
</body>
</html>
